subject: "Application for DevOps Engineer role"

message: |
  Hello,

  I am writing to express my interest in the DevOps Engineer role you posted on LinkedIn. I have 3+ years of experience in DevOps, working with AWS, Terraform, Docker, CI/CD pipelines, Jenkins, GitHub Actions, Linux, and automation. I am passionate about optimizing deployment processes, improving infrastructure, and delivering reliable solutions.

  As an immediate joiner, I am eager to contribute my skills and experience to your organization. Please find my resume attached for your consideration. I would welcome the opportunity to discuss how my background aligns with your requirements.

  Thank you for your time and consideration. I look forward to hearing from you.

  Best regards,
  Akshay Gale
  LinkedIn: https://www.linkedin.com/in/akshay-gale

resume_path: resume/Akshay_Gale_3yr_exp.pdf
